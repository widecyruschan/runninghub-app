services:
  runninghub-app:
    build:
      context: .
    container_name: runninghub-app
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./server.js:/app/server.js:ro
      - ./src:/app/src:ro
      - ./frontend:/app/frontend:ro
      - ./package.json:/app/package.json:ro
      # 使用命名卷保存 SQLite 數據，重新部署時數據不會丟失
      - runninghub-data:/app/data
    restart: unless-stopped

# 命名卷獨立於項目目錄，重新部署不會被覆蓋
volumes:
  runninghub-data:
