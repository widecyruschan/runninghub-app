      PAYPAL_CLIENT_SECRET: EO4wZGK_Ti9lVmeK58djzETLP70P_qYI17_yxKQNiUNSwWxhrsg03qB6-VW8L1AJDnEaUg51YEWGU1my
      PAYPAL_API_BASE_URL: https://api-m.sandbox.paypal.com
