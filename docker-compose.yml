services:
  # SMTP 郵件發送服務（Postfix relay）
  smtp:
    image: boky/postfix:latest
    container_name: runninghub-smtp
    environment:
      ALLOWED_SENDER_DOMAINS: imgkit.io
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      RELAYHOST: ${SMTP_RELAY_HOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USER:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASS:-}
      RELAYHOST_TLS_LEVEL: ${SMTP_RELAY_TLS_LEVEL:-may}
      MASQUERADED_DOMAINS: imgkit.io
      SMTP_HEADER_CHECKS: "true"
      INBOUND_TLS_ENFORCE: "false"
    restart: unless-stopped
    networks:
      - app-network

  runninghub-app:
    build:
      context: .
    container_name: runninghub-app
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      # MySQL 配置 (Hostinger: u963014207_runninghub)
      DB_TYPE: mysql
      MYSQL_HOST: auth-db1329.hstgr.io
      MYSQL_PORT: 3306
      MYSQL_USER: u963014207_runninghub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: u963014207_runninghub
      # SQLite fallback path (未使用 DB_TYPE=mysql 時生效)
      DATABASE_PATH: /app/data/app.sqlite
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY}
      RUNNINGHUB_API_BASE_URL: https://www.runninghub.cn/openapi/v2
      RUNNINGHUB_TASK_API_BASE_URL: https://www.runninghub.cn/task/openapi
      KIE_API_KEY: ${KIE_API_KEY}
      KIE_API_BASE_URL: https://api.kie.ai
      KIE_FILE_API_BASE_URL: https://kieai.redpandaai.co
      PAYPAL_MODE: live
      PAYPAL_CLIENT_ID: BAAWrJCI0ULGzPDfYne7fRLiX6r9T5-dCcfDnL2apHyg0GhawS-6nk23wTqhmlGVnywczj-opGvqpbrOoM
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_API_BASE_URL: https://api-m.paypal.com
      PAYPAL_WEBHOOK_ID: 64K6657558033082R
      CREEM_API_KEY: ${CREEM_API_KEY}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET}
      CREEM_API_BASE_URL: https://api.creem.io/v1
      PUBLIC_APP_BASE_URL: https://imgkit.io
      PUBLIC_API_BASE_URL: https://imgkit.io
      API_CORS_ALLOWED_ORIGINS: https://imgkit.io,https://www.imgkit.io
      SESSION_COOKIE_DOMAIN: .imgkit.io
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GOOGLE_OAUTH_REDIRECT_URI_LOCKED: ${GOOGLE_OAUTH_REDIRECT_URI_LOCKED:-false}
      TRANSLATION_PROVIDER: deepl
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      DEEPL_API_BASE_URL: https://api-free.deepl.com/v2
      # SMTP 邮件配置（通過內部 Postfix relay 發送）
      SMTP_HOST: smtp
      SMTP_PORT: 25
      SMTP_SECURE: false
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-noreply@imgkit.io}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-60}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - smtp

networks:
  app-network:
    driver: bridge
